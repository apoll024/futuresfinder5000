<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FuturesFinder5000 — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .logo {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .logo h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #00d4aa;
      letter-spacing: 0.5px;
    }
    .logo p {
      font-size: 0.78rem;
      color: #666;
      margin-top: 4px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 1rem;
    }
    input:focus { border-color: #00d4aa; }
    button {
      width: 100%;
      padding: 0.65rem;
      background: #00d4aa;
      color: #0d0d0d;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.25rem;
    }
    button:hover { background: #00b894; }
    .error {
      background: #2d1010;
      border: 1px solid #5a1a1a;
      color: #ff6b6b;
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>FuturesFinder5000</h1>
      <p>Leveraged ETF Day Trading Dashboard</p>
    </div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
