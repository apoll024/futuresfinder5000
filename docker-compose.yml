services:
  db:
    image: postgres:15
    container_name: ff_db
    environment:
      POSTGRES_DB: futuresfinder
      POSTGRES_USER: ff_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ff_user -d futuresfinder"]
      interval: 30s
      timeout: 10s
      retries: 5

  ingest:
    build: .
    container_name: ff_ingest
    command: python ingest/realtime.py
    environment:
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_PAPER=${ALPACA_PAPER:-true}
      - DB_URL=postgresql://ff_user:${DB_PASSWORD}@db:5432/futuresfinder
      - LLM_API_URL=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SYMBOLS=${SYMBOLS:-TQQQ,SQQQ,UPRO,SPXU,SOXL,SOXS,QQQ,SPY,SOXX}
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  settler:
    build: .
    container_name: ff_settler
    command: python ingest/settle.py
    environment:
      - DB_URL=postgresql://ff_user:${DB_PASSWORD}@db:5432/futuresfinder
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  watchdog:
    build: .
    container_name: ff_watchdog
    command: python ingest/watchdog.py
    environment:
      - DB_URL=postgresql://ff_user:${DB_PASSWORD}@db:5432/futuresfinder
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  digest:
    build: .
    container_name: ff_digest
    command: python ingest/news_digest.py
    environment:
      - DB_URL=postgresql://ff_user:${DB_PASSWORD}@db:5432/futuresfinder
      - SYMBOLS=${SYMBOLS:-TQQQ,SQQQ,UPRO,SPXU,SOXL,SOXS,QQQ,SPY,SOXX}
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    container_name: ff_api
    command: python api/app.py
    ports:
      - "0.0.0.0:5001:5001"
    environment:
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_PAPER=${ALPACA_PAPER:-true}
      - DB_URL=postgresql://ff_user:${DB_PASSWORD}@db:5432/futuresfinder
      - LLM_API_URL=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TRADE_MODE=${TRADE_MODE:-suggest}
      - SYMBOLS=${SYMBOLS:-TQQQ,SQQQ,UPRO,SPXU,SOXL,SOXS,QQQ,SPY,SOXX}
      - MAX_POSITION_USD=${MAX_POSITION_USD:-500}
      - MAX_DAILY_LOSS_USD=${MAX_DAILY_LOSS_USD:-200}
      - MAX_OPEN_POSITIONS=${MAX_OPEN_POSITIONS:-5}
      - FLASK_SECRET=${FLASK_SECRET:-ff5k-change-me-in-prod-32bytes!!}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY:-}
      - WALLET_NETWORK=${WALLET_NETWORK:-mainnet}
      - COINBASE_API_KEY_NAME=${COINBASE_API_KEY_NAME:-}
      - COINBASE_API_PRIVATE_KEY=${COINBASE_API_PRIVATE_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  crypto:
    build: .
    container_name: ff_crypto
    command: python ingest/crypto_realtime.py
    environment:
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_PAPER=${ALPACA_PAPER:-true}
      - DB_URL=postgresql://ff_user:${DB_PASSWORD}@db:5432/futuresfinder
      - LLM_API_URL=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CRYPTO_SYMBOLS=${CRYPTO_SYMBOLS:-BTC/USD,ETH/USD,SOL/USD}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY:-}
      - WALLET_NETWORK=${WALLET_NETWORK:-mainnet}
      - COINBASE_API_KEY_NAME=${COINBASE_API_KEY_NAME:-}
      - COINBASE_API_PRIVATE_KEY=${COINBASE_API_PRIVATE_KEY:-}
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  crypto-feeds:
    build: .
    container_name: ff_crypto_feeds
    command: python ingest/crypto_redundant_feeds.py
    environment:
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_PAPER=${ALPACA_PAPER:-true}
      - DB_URL=postgresql://ff_user:${DB_PASSWORD}@db:5432/futuresfinder
      - LLM_API_URL=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CRYPTO_SYMBOLS=${CRYPTO_SYMBOLS:-BTC/USD,ETH/USD,SOL/USD}
      - REDUNDANT_FEED_POLL_SECONDS=${REDUNDANT_FEED_POLL_SECONDS:-60}
      - REDUNDANT_FEED_ANALYZE=${REDUNDANT_FEED_ANALYZE:-true}
      - CMC_API_KEY=${CMC_API_KEY:-}
      - COINMARKETCAP_API_KEY=${COINMARKETCAP_API_KEY:-}
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  derivatives:
    build: .
    container_name: ff_derivatives
    command: python ingest/crypto_derivatives.py
    environment:
      - DB_URL=postgresql://ff_user:${DB_PASSWORD}@db:5432/futuresfinder
      - CRYPTO_SYMBOLS=${CRYPTO_SYMBOLS:-BTC/USD,ETH/USD,SOL/USD}
      - DERIVATIVES_POLL_SECONDS=${DERIVATIVES_POLL_SECONDS:-300}
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: